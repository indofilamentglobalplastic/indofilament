name: Render carousel Instagram

on:
  push:
    branches: [main]
    paths: ['ig/*/post.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock puppeteer-core@23.11.1
      - run: node .github/ig/render.js
      - name: Commit gambar
        run: |
          git config user.name "indofilament"
          git config user.email "indofilamentglobalplastic@gmail.com"
          git add ig
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "IG: render carousel"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
